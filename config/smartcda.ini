[smartcda]

; run game as administrator
admin = 0

; path of game executable
game = game.exe

; trace mode (record api calls without modding game)
trace = 0

; log debug messages in smartcda.log file
debug = 0

[audio]

; path of audio tracks, files named as track02.ogg, track03.ogg, etc.
; file types supported: flac, ogg, mp3
path = music

; track number of first audio track (normally track 1 is data track)
first = 2

; volume of audio player
volume = 100

[data]

; drive letter of fake cdrom
drive =

; label of fake cdrom
label =

; path of relocated cdrom root
root =

[registry]

; relocate keys from HKEY_LOCAL_MACHINE to HKEY_CURRENT_USER
; sample: 'lm2cu = Software\Atari\Pong'
lm2cu =

[display]

; high dpi scaling mode
; default:         do not care about it
; application:     disable scaling
; system:          enable bitmap scaling
; system-enhanced: enable gdi scaling
hidpi =

[memory]

; patch memory after creating game process, multiple entries allowed.
; entry format: 'address = bytes' (hex), max length: 128 bytes per entry.
; sample: '410000 = 33C0 90' (space for better readability)

410000 =
